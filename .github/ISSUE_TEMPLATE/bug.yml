name: Bug report
description: Report a reproducible Poolboy defect
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not report a vulnerability here. Follow SECURITY.md.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Provide the smallest deterministic steps, command, code, or repository that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Poolboy version or commit, OS/runtime, and relevant configuration.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs or evidence
      description: Include sanitized output, links, or screenshots. Remove secrets and personal data.
    validations:
      required: false
