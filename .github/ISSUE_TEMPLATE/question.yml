name: Question
description: Ask for help using or building Poolboy
title: "[Question]: "
labels: ["question"]
body:
  - type: textarea
    id: question
    attributes:
      label: What would you like to know?
      description: Ask one focused question and include the relevant command or behavior.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Include the Poolboy version or commit, environment, and a minimal example where useful.
    validations:
      required: true
  - type: textarea
    id: attempted
    attributes:
      label: What have you tried?
      description: Include relevant output or links. Remove secrets and personal data.
    validations:
      required: false
