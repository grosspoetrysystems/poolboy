name: contribution-queue

# Keeps queue state current between pull request events: comments, maintainer
# reviews on fork pull requests, and the passage of time for nudges and pauses.
# The hourly sweep also opens one issue when a newer Helicopter release is out.
on:
  # Privileged by design: labels and comments need a write token. Only trusted
  # default-branch code runs; scripts/check_install.py checks that.
  issue_comment: # zizmor: ignore[dangerous-triggers]
    types: [created]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  HELICOPTER_MODE: ${{ vars.HELICOPTER_MODE || 'contributor' }}
  HELICOPTER_AUTOMATION_LOGINS: ${{ vars.HELICOPTER_AUTOMATION_LOGINS || 'dependabot[bot]' }}

concurrency:
  group: contribution-queue-${{ github.event.issue.number || 'sweep' }}
  cancel-in-progress: false

jobs:
  queue:
    if: ${{ github.event_name != 'issue_comment' || github.event.issue.pull_request }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
      issues: write
      pull-requests: write
    steps:
      - name: Check out queue from protected default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted-base
          persist-credentials: false
          sparse-checkout: |
            scripts
            .github/helicopter
          fetch-depth: 1
      # Security invariant: read pull request metadata and timelines only; never
      # check out or execute pull request code.
      - name: Update queue state
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          HELICOPTER_QUEUE_NUDGE_HOURS: ${{ vars.HELICOPTER_QUEUE_NUDGE_HOURS }}
          HELICOPTER_QUEUE_PAUSE_HOURS: ${{ vars.HELICOPTER_QUEUE_PAUSE_HOURS }}
        run: |
          if [ -n "${PR_NUMBER:-}" ]; then
            python3 trusted-base/scripts/pr_queue.py --pr "$PR_NUMBER"
          else
            python3 trusted-base/scripts/pr_queue.py
          fi
