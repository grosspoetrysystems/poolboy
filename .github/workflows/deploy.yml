name: Deploy

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version shown on the landing page
        required: false
        type: string
  workflow_run:
    workflows:
      - release
    types:
      - completed
permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: companion/package.json
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: companion/pnpm-lock.yaml
      - name: Install companion dependencies
        run: pnpm --dir companion install --frozen-lockfile
      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        with:
          cosign-release: v2.6.0
      - name: Resolve displayed version
        id: version
        shell: bash
        run: |
          VERSION="${VERSION_INPUT}"
          if [ -z "${VERSION}" ]; then
            VERSION="$(gh release view --repo "${GITHUB_REPOSITORY}" --json tagName --jq .tagName 2>/dev/null || echo development)"
          fi
          VERSION="${VERSION#v}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_INPUT: ${{ inputs.version }}
      # SITE_URL (a repository variable) absolutizes share-card and canonical
      # URLs; leave it unset to keep them root-relative to the served host.
      - name: Build site
        run: make site
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          SITE_VERSION: ${{ steps.version.outputs.version }}
      - name: Rebuild hosted CLI help from release snapshots
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          HELP_ROOT=".site/cli/help"
          rm -rf "${HELP_ROOT}"
          mkdir -p "${HELP_ROOT}"
          DOWNLOADS="$(mktemp -d)"
          trap 'rm -rf "${DOWNLOADS}"' EXIT

          mapfile -t RELEASES < <(
            gh release list \
              --repo "${GITHUB_REPOSITORY}" \
              --limit 1000 \
              --json tagName,isDraft,isPrerelease,publishedAt \
              --jq 'map(select(.isDraft == false and .isPrerelease == false)) | sort_by(.publishedAt) | reverse | .[].tagName'
          )
          retained=0
          for tag in "${RELEASES[@]}"; do
            if [[ "${tag}" != v* ]]; then
              echo "Skipping stable release with unsupported tag: ${tag}" >&2
              continue
            fi
            version="${tag#v}"
            asset="poolboy-help-v${version}.tar.gz"
            if ! gh release view "${tag}" \
              --repo "${GITHUB_REPOSITORY}" \
              --json assets \
              --jq '.assets[].name' | grep -Fxq "${asset}"; then
              continue
            fi
            gh release download "${tag}" \
              --repo "${GITHUB_REPOSITORY}" \
              --pattern "${asset}" \
              --dir "${DOWNLOADS}"
            if [[ ! -s "${DOWNLOADS}/${asset}" ]]; then
              echo "${tag} is missing ${asset}" >&2
              exit 1
            fi
            tar -tzf "${DOWNLOADS}/${asset}" >/dev/null
            tar -xzf "${DOWNLOADS}/${asset}" -C "${HELP_ROOT}"
            if [[ ! -f "${HELP_ROOT}/v${version}/index.json" ]]; then
              echo "${asset} does not contain v${version}/index.json" >&2
              exit 1
            fi
            retained=$((retained + 1))
            if (( retained == 12 )); then
              break
            fi
          done
          if (( retained == 0 )); then
            echo "No published stable release has a CLI help snapshot." >&2
            exit 1
          fi

          node scripts/generate-help-snapshot.mjs manifest "${HELP_ROOT}"
      - name: Sign corpus manifest
        run: cosign sign-blob --new-bundle-format --bundle .site/docs/graph.json.sigstore.json --yes .site/docs/graph.json
      - name: Deploy
        uses: cloudflare/wrangler-action@25853364521e0d392ece9b0c1e97a4b37b638087 # v4.1.2
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.138.0"
