name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Require a version tag
        id: version
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "Run this workflow against a v* tag." >&2
            exit 1
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "${GITHUB_REF_NAME} is not a supported semantic version tag." >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Checkout tagged tree
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: companion/package.json

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: companion/pnpm-lock.yaml

      - name: Install companion dependencies
        run: pnpm --dir companion install --frozen-lockfile

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        with:
          cosign-release: v2.6.0

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify released version
        shell: bash
        run: |
          ARCHIVE=".release/poolboy_${{ steps.version.outputs.version }}_linux_amd64.tar.gz"
          tar -xOf "${ARCHIVE}" poolboy > /tmp/poolboy
          chmod +x /tmp/poolboy
          ACTUAL="$(/tmp/poolboy version)"
          if [ "${ACTUAL}" != "${{ steps.version.outputs.version }}" ]; then
            echo "Built CLI reports ${ACTUAL}; expected ${{ steps.version.outputs.version }}." >&2
            exit 1
          fi
      - name: Create immutable CLI help snapshot
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          SNAPSHOT_ROOT="$(mktemp -d)"
          ASSET="poolboy-help-v${VERSION}.tar.gz"
          trap 'rm -rf "${SNAPSHOT_ROOT}" "${ASSET}"' EXIT
          node scripts/generate-help-snapshot.mjs snapshot "${VERSION}" "${SNAPSHOT_ROOT}"
          tar -czf "${ASSET}" -C "${SNAPSHOT_ROOT}" "v${VERSION}"
          test -s "${ASSET}"
          gh release upload "${TAG}" "${ASSET}" --repo "${GITHUB_REPOSITORY}"

      - name: Pack npm distributions
        run: node scripts/package-npm.mjs "${{ steps.version.outputs.version }}"

      - name: Upload npm distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-${{ steps.version.outputs.version }}
          path: .release/npm/
          include-hidden-files: true
          retention-days: 1

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            .release/*.tar.gz
            .release/*.zip

  publish-npm:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify trusted-publishing npm version
        shell: bash
        run: |
          node - <<'NODE'
          const { execFileSync } = require('node:child_process');
          const required = [11, 5, 1];
          const version = execFileSync('npm', ['--version'], { encoding: 'utf8' }).trim();
          const actual = version.split('.').map(Number);
          const firstDiff = actual.findIndex((part, index) => part !== required[index]);
          const ok = actual.length === 3 && actual.every(Number.isFinite) &&
            (firstDiff === -1 || actual[firstDiff] > required[firstDiff]);
          if (!ok) {
            console.error(`npm ${version} is too old for trusted publishing; need >= ${required.join('.')}.`);
            process.exit(1);
          }
          console.log(`npm ${version} supports trusted publishing.`);
          NODE

      - name: Download npm distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-${{ needs.release.outputs.version }}
          path: .release/npm/

      - name: Publish platform packages, then wrapper
        run: node scripts/publish-npm.mjs

  smoke-npm:
    needs: [release, publish-npm]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install and run the published package
        shell: bash
        run: |
          VERSION="${{ needs.release.outputs.version }}"
          PACKAGES=(
            poolboy
            poolboy-darwin-arm64
            poolboy-darwin-x64
            poolboy-linux-arm64
            poolboy-linux-x64
            poolboy-win32-arm64
            poolboy-win32-x64
          )
          CACHE="$(mktemp -d)"
          for attempt in $(seq 1 60); do
            visible=true
            for package in "${PACKAGES[@]}"; do
              if ! npm view "@grosspoetrysystems/${package}@${VERSION}" version --cache "${CACHE}" --prefer-online >/dev/null 2>&1; then
                visible=false
                break
              fi
            done
            if "${visible}"; then
              break
            fi
            if [ "${attempt}" = 60 ]; then
              echo "npm did not expose every Poolboy package at ${VERSION} within ten minutes." >&2
              exit 1
            fi
            rm -rf "${CACHE}"
            CACHE="$(mktemp -d)"
            sleep 10
          done
          mkdir smoke && cd smoke
          npm init --yes >/dev/null
          npm install --ignore-scripts --no-audit --no-fund "@grosspoetrysystems/poolboy@${VERSION}"
          ACTUAL="$(./node_modules/.bin/poolboy version)"
          if [ "${ACTUAL}" != "${VERSION}" ]; then
            echo "Published CLI reports ${ACTUAL}; expected ${VERSION}." >&2
            exit 1
          fi

  publish-release:
    needs: [release, smoke-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish inspected GitHub release
        shell: bash
        run: gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
